<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo pizarra oscuro con matiz profundo -->
    <linearGradient id="deepDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Lienzo exterior Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#deepDark)" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Círculo concéntrico sutil de calibración exterior -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="#1e293b" stroke-width="3" />

  <!-- Anillo principal con apertura en azul cian / neón -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="829" stroke-dashoffset="240" stroke-linecap="round" />

  <!-- Checkmark esbelto central con acabado arquitectónico -->
  <path d="M 190 258 L 236 304 L 324 204" fill="none" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
